name: Secret scan

# Pull requests are scanned by this file as it exists on the base branch
# (pull_request_target), never by the copy inside the pull request. A pull
# request therefore cannot replace the scan with a no-op while keeping the
# required "Gitleaks" check green. The job still reports the "Gitleaks" check
# on the pull request head commit, so branch protection keeps gating merges.
#
# Why this stays safe with pull_request_target:
#   * Read-only: permissions stay at contents: read, no repository or
#     organisation secrets are referenced, and credential persistence is
#     disabled on checkout. The token is never written into the workspace.
#   * No pull request code is executed. The head is fetched as git objects
#     only (no working tree is created for it) and gitleaks reads diffs. No
#     PR file, script or build output is ever run.
#   * Event fields reach run: blocks through env: and are quoted, so a
#     PR-controlled string cannot be interpolated into the shell script.
#   * .gitleaks.toml and .gitleaksignore still come from the trusted base
#     ref, so ignore rules in a pull request only apply after merge.
#
# Trade-offs and requirements:
#   * Changes to this workflow file take effect only after they are merged.
#   * The head is fetched anonymously from refs/pull/<n>/head of the base
#     repository, so the repository must stay publicly readable. If it ever
#     becomes private the fetch fails closed (red check) rather than
#     silently skipping.
#   * The base repository needs an allowed Actions event policy for
#     pull_request_target. GitHub's default policy for public repositories
#     blocks this event (evaluate mode until 2026-12-02, enforced after), so
#     add an event policy that allows pull_request_target or the required
#     check will stop being produced and merges will stay blocked.
#   * Fork pull requests depend on the default "do not send write tokens to
#     pull requests from forks" setting; do not change that setting.
#   * The job keeps the exact name "Gitleaks" so branch protection keeps
#     matching the required check after the trigger change.
on:
  pull_request_target:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  # pull_request_target runs share github.ref (the base branch), so key the
  # group on the pull request number to keep PR runs independent.
  group: secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target checks out the base branch: trusted content.
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pull request head as git data
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          # Fetching objects is data-only: no working tree is created for the
          # head and nothing from the pull request is checked out or run.
          git fetch --no-tags --no-write-fetch-head --no-recurse-submodules origin \
            "+refs/pull/${PR_NUMBER}/head:refs/gitleaks/pr-head"
          fetched_sha="$(git rev-parse refs/gitleaks/pr-head)"
          if [ "$fetched_sha" != "$PR_HEAD_SHA" ]; then
            echo "::error::Fetched pull request head $fetched_sha does not match event head $PR_HEAD_SHA"
            exit 1
          fi
      - name: Install Gitleaks 8.30.1
        run: |
          curl --fail --location --silent --show-error \
            --proto '=https' --tlsv1.2 --max-time 120 \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP" gitleaks
      - name: Prepare trusted Gitleaks config
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Config and ignore files come from the trusted ref (the PR base, or
          # HEAD for push/schedule), so edits to .gitleaks.toml or
          # .gitleaksignore in a pull request take effect only after merge.
          set -euo pipefail
          trusted_root="$RUNNER_TEMP/gitleaks-trusted"
          config_dir="$trusted_root/config"
          source_dir="$trusted_root/source"
          rm -rf "$trusted_root"
          mkdir -p "$config_dir"

          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            trusted_ref="$BASE_SHA"
          else
            trusted_ref="HEAD"
          fi
          if ! git cat-file -e "$trusted_ref^{commit}" 2>/dev/null; then
            echo "::error::Trusted Gitleaks source $trusted_ref is not available in the checkout"
            exit 1
          fi

          if git cat-file -e "$trusted_ref:.gitleaks.toml" 2>/dev/null; then
            git show "$trusted_ref:.gitleaks.toml" > "$config_dir/.gitleaks.toml"
          else
            printf '[extend]\nuseDefault = true\n' > "$config_dir/.gitleaks.toml"
          fi
          if git cat-file -e "$trusted_ref:.gitleaksignore" 2>/dev/null; then
            git show "$trusted_ref:.gitleaksignore" > "$config_dir/.gitleaksignore"
          else
            printf '' > "$config_dir/.gitleaksignore"
          fi

          git worktree add --detach --quiet "$source_dir" "$trusted_ref"
      - name: Scan complete event range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          range_endpoints=""
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            range="$BASE_SHA..$HEAD_SHA"
            range_endpoints="$BASE_SHA $HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE_SHA..$HEAD_SHA"
            range_endpoints="$BEFORE_SHA $HEAD_SHA"
            git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null || {
              range="--all"
              range_endpoints=""
            }
          else
            range="--all"
          fi

          if [ "$range" != "--all" ]; then
            for endpoint in $range_endpoints; do
              if ! git rev-parse --verify --quiet "$endpoint^{commit}" >/dev/null; then
                echo "::error::Gitleaks range endpoint $endpoint is not a commit in this checkout"
                exit 1
              fi
            done
          fi

          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            commit_count="$(git rev-list --count "$range")"
            if [ "$commit_count" -lt 1 ]; then
              echo "::error::Pull request range $range contains no commits; refusing to report a clean scan"
              exit 1
            fi
          fi

          # --ignore-gitleaks-allow stops a pull request from suppressing a
          # finding with an inline "gitleaks:allow" comment in the scanned
          # diff. Intentional test secrets must be added to the trusted base
          # .gitleaksignore or .gitleaks.toml instead, and only after merge.
          "$RUNNER_TEMP/gitleaks" git --ignore-gitleaks-allow --redact --verbose \
            --config "$RUNNER_TEMP/gitleaks-trusted/config/.gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-trusted/config/.gitleaksignore" \
            --log-opts="--diff-merges=first-parent $range" \
            "$RUNNER_TEMP/gitleaks-trusted/source"
