name: Dependency audit

on:
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Fixable vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - name: Export runtime dependencies
        run: uv export --quiet --locked --no-dev --no-hashes --no-emit-project --output-file /tmp/requirements-audit.txt
      - name: Audit dependencies
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: |
          set +e
          uvx --python 3.12 --from pip-audit==2.10.1 pip-audit --requirement /tmp/requirements-audit.txt --format json --output /tmp/audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            exit "$audit_status"
          fi
          python3 - <<'PY'
          import json
          import sys

          with open("/tmp/audit.json", encoding="utf-8") as report:
              dependencies = json.load(report)["dependencies"]
          fixable = [
              (dependency["name"], vulnerability["id"], vulnerability["fix_versions"])
              for dependency in dependencies
              for vulnerability in dependency.get("vulns", [])
              if vulnerability.get("fix_versions")
          ]
          for package, vulnerability, fixes in fixable:
              print(f"{package}: {vulnerability} (fix: {', '.join(fixes)})")
          sys.exit(bool(fixable))
          PY
