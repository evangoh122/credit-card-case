name: Dependency audit

on:
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Fixable vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Export runtime dependencies
        run: uv export --quiet --locked --no-dev --no-hashes --no-emit-project --output-file /tmp/requirements-audit.txt
      - name: Export Windows runtime dependencies
        run: uv pip compile /tmp/requirements-audit.txt --python 3.12 --python-platform x86_64-pc-windows-msvc --no-deps --no-annotate --no-header --quiet --output-file /tmp/requirements-audit-win.txt
      - name: Audit dependencies
        run: |
          set +e
          uvx --python 3.12 --from pip-audit==2.10.1 pip-audit \
            --requirement /tmp/requirements-audit.txt \
            --requirement /tmp/requirements-audit-win.txt \
            --no-deps --disable-pip \
            --format json --output /tmp/audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then
            exit "$audit_status"
          fi
          python3 - <<'PY'
          import json
          import sys

          with open("/tmp/audit.json", encoding="utf-8") as report:
              dependencies = json.load(report)["dependencies"]
          findings = [
              (dependency["name"], vulnerability["id"], vulnerability.get("fix_versions", []))
              for dependency in dependencies
              for vulnerability in dependency.get("vulns", [])
          ]
          for package, vulnerability, fixes in findings:
              fix_text = ", ".join(fixes) if fixes else "none available"
              print(f"{package}: {vulnerability} (fix: {fix_text})")
          sys.exit(any(fixes for _, _, fixes in findings))
          PY
