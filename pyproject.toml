[project]
name = "credit-card-case"
version = "0.4.0"
description = "Synthetic US credit-card portfolio generator and research platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<26",
]

[project.optional-dependencies]
research = [
    "duckdb>=1.1",
    "statsmodels>=0.14",
    "linearmodels>=6.1",
    "scipy>=1.14",
    "lifelines>=0.30",
    "scikit-survival>=0.23",
    "pymc>=5.18",
    "arviz>=0.20",
    "dowhy>=0.11",
    "econml>=0.15",
    "evidently>=0.6",
]
mlops = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "mlflow>=2.17",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "dagster>=1.9",
]
synthesis = [
    "faker>=30",
    "sdv>=1.17",
    "ydata-synthetic>=1.3",
]

[tool.setuptools.packages.find]
include = ["build*"]
