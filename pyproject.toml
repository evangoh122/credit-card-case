[project]
name = "ccc"
version = "0.1.0"
description = "Credit card case: segmentation, offer experiments and drift monitoring on a seeded simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "faker>=40.43.0",
    "mlflow>=3.17.2",
    "numpy",
    "polars",
    "scikit-learn",
    "scipy",
    "sdv>=2.0.0",
]

[project.optional-dependencies]
hf = [
    "huggingface-hub>=2.3.0",
]

[dependency-groups]
dev = [
    "nbformat>=5.11.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: fits SDV synthesizers; run with -m slow"]

[tool.ruff]
line-length = 100
# original/ is a separate project (own pyproject, Python 3.13, pandas style)
extend-exclude = ["original"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/colab_generate_15m.ipynb" = ["E401", "E501", "I001"]
