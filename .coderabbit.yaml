# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "dependabot[bot]"
  path_instructions:
    - path: "src/ccc/**"
      instructions: |
        Require all stored timestamps to be UTC. Reject fixed UTC offsets and 24-hour arithmetic.
        Reject naive datetimes and wall-clock datetime.now()/utcnow() calls in data paths.
        Ban 24-hour arithmetic because DST calendar days can contain 23 or 25 hours.
        Ensure sim_truth columns never reach features or frames.
        Require seeded random number generation and reject calls to now().
    - path: "tests/**"
      instructions: |
        Ensure tests can fail when behavior regresses and do not copy production logic.
    - path: ".github/**"
      instructions: |
        Flag pull_request_target, overly broad permissions, and github context interpolation in run blocks.
  path_filters:
    - "!uv.lock"
    - "!requirements.txt"
  tools:
    gitleaks:
      enabled: true
    ruff:
      enabled: true
